name: Qualify pinned agent runtime (build only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exp710-build-only-703c118
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REVISION: 703c118c66277ca42c45808a2f6cc620429c6718
      RUNTIME: agent-a2a
    steps:
      - name: Read reviewed qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qualification
          persist-credentials: false
      - name: Read immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 703c118c66277ca42c45808a2f6cc620429c6718
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Verify source and exporter contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$REVISION"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = a5578cb57829d36f4f2c0bb7f1b507af8783a023
          test -z "$(git -C candidate status --porcelain)"
          python3 -m unittest discover -s qualification/.github/scripts -p 'test_qualify_agent_oci.py'
      - name: Verify pinned hosted consent enable, OFF and rollback contract
        working-directory: candidate/deploy/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/agent-runtime.test.ts test/hosted-consent-supervisor.test.mjs test/deploy-artifact.test.mjs
          npm run typecheck
      - name: Build local AMD64 image and OCI archive without publication
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --build-arg VLPDS_RUNTIME_STAGE=agent-a2a --build-arg VLPDS_GIT_REV="$REVISION" \
            --provenance=false --sbom=false \
            --output "type=docker,name=vlpds:exp710-qualification" \
            --output "type=oci,dest=$RUNNER_TEMP/agent-runtime.oci.tar" .
      - name: Qualify immutable local image with network-denied synthetic smoke
        working-directory: candidate
        run: GITHUB_SHA="$REVISION" node deploy/cloudflare/scripts/verify-artifact.mjs inspect vlpds:exp710-qualification "$RUNNER_TEMP/verified-runtime.json"
      - name: Bind exported OCI config to qualified image and receipt
        run: python3 qualification/.github/scripts/qualify_agent_oci.py "$RUNNER_TEMP/agent-runtime.oci.tar" "$RUNNER_TEMP/verified-runtime.json" "$RUNNER_TEMP/oci-qualification.json"
      - name: Retain bounded qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-runtime-receipt-703c118-${{ github.run_id }}
          path: ${{ runner.temp }}/oci-qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain OCI archive only in GitHub artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-runtime-oci-703c118-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-runtime.oci.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
