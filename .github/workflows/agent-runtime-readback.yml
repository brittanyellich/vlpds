name: Read qualified agent registry (pull only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: exp710-registry-readback-ea8627d4
  cancel-in-progress: false
jobs:
  readback:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Install inspection tools without building an image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          npm ci --prefix deploy/cloudflare --ignore-scripts --no-audit --no-fund
      - name: Validate readback-only contract without credentials
        run: python3 -m unittest discover -s .github/scripts -p 'test_read_agent_registry.py'
      - name: Authenticate exact source run, receipt and OCI bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/read_agent_registry.py verify
      - name: Read exact remote manifest and config with pull-only access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/read_agent_registry.py read
      - name: Retain credential-free registry receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-runtime-readback-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/exp710-readback-receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned downloaded candidate files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/exp710-readback-source"
