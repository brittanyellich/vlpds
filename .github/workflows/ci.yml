name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds for target-cpu=native. Cached artifacts can be
  # restored on a runner with a different CPU, so CI builds for the baseline.
  RUSTFLAGS: ""

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # tests/all/go_checker.rs builds checker/ (the Go sync 1.1 checker)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: checker/go.mod
          cache-dependency-path: checker/go.sum
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --bins
      - run: cargo test --locked --lib
      # Every test boots an in-process server on the in-memory store, so the
      # suite needs no MinIO or docker.
      - name: Test sanitized integration reporter
        run: python3 -m unittest discover -s .github/scripts -p test_rust_integration_test_report.py
      - name: Rust integration tests with sanitized failure report
        id: integration
        run: python3 .github/scripts/rust_integration_test_report.py
      - name: Retain only sanitized integration failure report
        if: failure() && steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-integration-test-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-integration-test-result.json
          if-no-files-found: warn
          retention-days: 1

  agent-contact:
    name: Local agent contact pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: agent-contact
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm --prefix tools/agent-contact-pilot test
      - run: npm --prefix tools/agent-contact-pilot run check
      - run: cargo test --locked --no-default-features --lib agent_contact_pilot
      - name: Disposable repository and same-DID card acceptance (sequential)
        run: cargo test --locked --no-default-features --test agent_contact_repository -- --test-threads=1
      - run: cargo build --locked --no-default-features --bin vlpds
      - name: Native default-off and signed routing acceptance
        run: node tools/agent-contact-pilot/native-smoke.mjs target/debug/vlpds

  ui:
    name: UI and docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check-docs

  cloudflare:
    name: Cloudflare Worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s ../../.github/scripts -p test_off_staging_evidence.py
      - run: npm run test:runtime

  container:
    name: Linux container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Build the production image (no publish)
        run: docker build --build-arg CARGO_PROFILE=release -t vlpds:ci .
      - name: Check memory plan and start with Spaces
        run: |
          node deploy/cloudflare/check-memory.mjs --docker vlpds:ci
          docker run -d --name vlpds-ci -p 127.0.0.1:2583:2583 vlpds:ci --memory --dev-mode --spaces --public-url http://127.0.0.1:2583
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:2583/xrpc/com.atproto.server.describeServer; then exit 0; fi
            sleep 2
          done
          docker logs vlpds-ci
          exit 1
      - name: Export tested deployment image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: docker save vlpds:ci | gzip > "$RUNNER_TEMP/vlpds-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: vlpds-linux-amd64
          path: ${{ runner.temp }}/vlpds-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Stop test container
        if: always()
        run: docker rm -f vlpds-ci || true
