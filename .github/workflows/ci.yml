name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds for target-cpu=native. Cached artifacts can be
  # restored on a runner with a different CPU, so CI builds for the baseline.
  RUSTFLAGS: ""

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # tests/all/go_checker.rs builds checker/ (the Go sync 1.1 checker)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: checker/go.mod
          cache-dependency-path: checker/go.sum
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --bins
      - run: cargo test --locked --lib
      # Every test boots an in-process server on the in-memory store, so the
      # suite needs no MinIO or docker.
      - run: cargo test --locked --test all --test argon2_shed --test fresh_metrics

  ui:
    name: UI and docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check-docs

  cloudflare:
    name: Cloudflare Worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run dry-run

  container:
    name: Linux container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Build the production image (no publish)
        run: docker build --build-arg CARGO_PROFILE=release -t vlpds:ci .
      - name: Check memory plan and start with Spaces
        run: |
          node deploy/cloudflare/check-memory.mjs --docker vlpds:ci
          docker run -d --name vlpds-ci -p 127.0.0.1:2583:2583 vlpds:ci --memory --dev-mode --spaces --public-url http://127.0.0.1:2583
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:2583/xrpc/com.atproto.server.describeServer; then exit 0; fi
            sleep 2
          done
          docker logs vlpds-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f vlpds-ci || true
