name: Deploy Cloudflare PDS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build this revision, or roll back to a previously deployed Cloudflare image digest
        type: choice
        required: true
        options: [deploy, rollback]
      runtime:
        description: Ordinary image or agent-capable image (A2A remains disabled)
        type: choice
        default: pds-runtime
        required: true
        options: [pds-runtime, agent-a2a]
      rollback_image:
        description: For rollback only, full registry.cloudflare.com/.../vlpds@sha256:... reference
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: crate-pds-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    defaults:
      run:
        working-directory: deploy/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_TOKEN: ${{ secrets.VLPDS_DEPLOY_TOKEN }}
      DEPLOY_CONFIG: ${{ secrets.VLPDS_CLOUDFLARE_CONFIG_JSON }}
      OPERATION: ${{ inputs.operation }}
      RUNTIME: ${{ inputs.runtime || 'pds-runtime' }}
      ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run typecheck
      - name: Select public artifact receipt path
        run: echo "ARTIFACT_FILE=$RUNNER_TEMP/verified-artifact.json" >> "$GITHUB_ENV"
      - name: Validate selection before build or registry writes
        run: node scripts/prepare-deploy.mjs --preflight
      - name: Build expected UI entry for public verification
        if: inputs.operation == 'deploy'
        run: |
          npm ci --prefix ../../ui --no-audit --no-fund
          npm run build --prefix ../../ui
          echo "EXPECTED_UI_ASSET=$(node scripts/verify-ui.mjs --expected ../../ui/dist/index.html)" >> "$GITHUB_ENV"

      - name: Build and verify selected runtime before publishing
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          case "$RUNTIME" in pds-runtime|agent-a2a) ;; *) exit 1 ;; esac
          local_image="vlpds:deploy-$GITHUB_SHA"
          docker build --platform linux/amd64 --build-arg VLPDS_RUNTIME_STAGE="$RUNTIME" \
            --build-arg VLPDS_GIT_REV="$GITHUB_SHA" -t "$local_image" ../..
          node scripts/verify-artifact.mjs inspect "$local_image" "$ARTIFACT_FILE"
          npx wrangler containers push "$local_image"
          node scripts/verify-artifact.mjs pin "$local_image" "$ARTIFACT_FILE"

      - name: Retain public artifact verification receipt
        if: inputs.operation == 'deploy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/verified-artifact.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate and prepare live configuration
        run: node scripts/prepare-deploy.mjs

      - name: Read current image before any changes
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            https://admin.crate.social/_deploy/status > "$RUNNER_TEMP/before.json" || \
            echo 'No deploy endpoint yet (first deployment of this workflow).' >&2
          node -e 'const fs=require("fs");let p=process.env.RUNNER_TEMP+"/before.json";if(fs.statSync(p).size){let s=JSON.parse(fs.readFileSync(p));console.log("Previously running image:",s.current)}'

      - name: Publish Worker and named image
        # Only the verified, digest-pinned image is published; Wrangler must not
        # perform a second unverified build. Existing scheduling remains unchanged.
        run: npx wrangler deploy --config .ci-deployment.json

      - name: Switch container image gracefully
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error -H "Authorization: Bearer $DEPLOY_TOKEN" \
                https://admin.crate.social/_deploy/status > "$RUNNER_TEMP/status.json"; then break; fi
            sleep 3
          done
          test -s "$RUNNER_TEMP/status.json"
          desired=$(node scripts/prepare-deploy.mjs --verify-desired "$RUNNER_TEMP/status.json")
          test -n "$desired" && test "$desired" != undefined
          if [ "$OPERATION" = rollback ]; then
            test "$desired" = "$ROLLBACK_IMAGE" || { echo 'Worker image map does not match requested rollback digest.' >&2; exit 1; }
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" -H "X-Deploy-Image: $desired" \
            https://admin.crate.social/_deploy/restart
          echo "DESIRED_IMAGE=$desired" >> "$GITHUB_ENV"

      - name: Verify new image, public health and UI
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            # A public request starts the new image only once the old process exits.
            curl --max-time 5 -fsS https://pds.crate.social/xrpc/_health >/dev/null || true
            if curl --fail --silent --show-error -H "Authorization: Bearer $DEPLOY_TOKEN" \
                https://admin.crate.social/_deploy/status > "$RUNNER_TEMP/status.json" && \
               node -e 'let s=JSON.parse(require("fs").readFileSync(process.argv[1]));process.exit(s.running && s.current===process.env.DESIRED_IMAGE?0:1)' "$RUNNER_TEMP/status.json" && \
               curl --max-time 5 -fsS https://pds.crate.social/xrpc/_health >/dev/null && \
               { [ "$OPERATION" = rollback ] || node scripts/verify-ui.mjs --public "$EXPECTED_UI_ASSET"; }; then
              exit 0
            fi
            sleep 5
          done
          echo 'New image or public UI did not match; inspect Cloudflare logs and explicitly roll back if safe.' >&2
          exit 1

      - name: Deployment record
        if: success()
        run: |
          {
            echo "### Cloudflare PDS $OPERATION"
            echo "- Image: \`$DESIRED_IMAGE\`"
            echo "- Previous: \`$(node -e 'let fs=require("fs"),p=process.env.RUNNER_TEMP+"/before.json";console.log(fs.statSync(p).size?JSON.parse(fs.readFileSync(p)).current:"unknown")')\`"
            echo '- Running image matched and public health passed; deploys also verified the public UI entry and asset.'
          } >> "$GITHUB_STEP_SUMMARY"
