name: Complete one guarded PDS restart

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: crate-pds-cloudflare-production
  cancel-in-progress: false

jobs:
  restart:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: production
    steps:
      - name: Guard and verify the already qualified image
        env:
          VLPDS_DEPLOY_TOKEN: ${{ secrets.VLPDS_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          # BEGIN_GUARDED_RESTART
          import http.client
          from html.parser import HTMLParser
          import json
          import os
          import re
          import signal
          import ssl
          import sys
          import time

          class ScriptInventory(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.sources = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      values = [value for key, value in attrs if key == "src"]
                      self.sources.append(values[0] if len(values) == 1 else None)

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          DIGEST = "2e254f9394937be2141e192b715f88867a349bbd85c80d9279e435282b11161d"
          WORKER = "7572d63f-a93e-4bb3-876a-bba6348cba7e"
          ASSET = "/assets/index-D5JRYEyV.js"
          CARD = "/agents/did%3Aplc%3A6tlvgafuonoighfrtpejff5m/.well-known/agent-card.json"
          ADMIN, PUBLIC, CF = "admin.crate.social", "pds.crate.social", "api.cloudflare.com"
          EXPECTED_BINDINGS = {
              'ADMIN_HOST': 'plain_text',
              'ADMIN_TOKEN': 'secret_text',
              'AGENT_A2A_ENABLED': 'plain_text',
              'AGENT_A2A_RUNTIME': 'plain_text',
              'CF_ACCOUNT_ID': 'secret_text',
              'DEPLOY_TOKEN': 'secret_text',
              'EMAIL_API_TOKEN': 'secret_text',
              'EMAIL_API_URL': 'secret_text',
              'EMAIL_FROM_ADDRESS': 'secret_text',
              'ENABLED': 'plain_text',
              'HANDLE_DOMAIN': 'plain_text',
              'INTERNAL_TOKEN': 'secret_text',
              'JWT_SECRET': 'secret_text',
              'KEK': 'secret_text',
              'OPERATOR_DID': 'plain_text',
              'PDS': 'durable_object_namespace',
              'PLC_RECOVERY_DID_KEY': 'secret_text',
              'PLC_ROTATION_KEY_HEX': 'secret_text',
              'PUBLIC_HOST': 'plain_text',
              'S3_ACCESS_KEY': 'secret_text',
              'S3_BUCKET': 'plain_text',
              'S3_PREFIX': 'plain_text',
              'S3_SECRET_KEY': 'secret_text',
          }


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate field")
                  result[key] = value
              return result


          def decoded(body):
              return json.loads(body.decode("utf-8"), object_pairs_hook=unique_object)


          def deadline(_signum, _frame):
              raise TimeoutError("Request deadline")


          def exchange(method, host, path, headers, limit, prefix, remaining):
              if remaining <= 0:
                  raise TimeoutError("Overall deadline")
              cap = min(75 if method == "POST" else 15, remaining)
              signal.setitimer(signal.ITIMER_REAL, cap)
              connection = http.client.HTTPSConnection(host, 443, timeout=min(cap, 70 if method == "POST" else 10), context=ssl.create_default_context())
              try:
                  connection.request(method, path, body=b"" if method == "POST" else None, headers=headers)
                  response = connection.getresponse()
                  if response.getheader("Content-Encoding", "identity").lower() != "identity":
                      raise ValueError("Encoded response")
                  length = response.getheader("Content-Length")
                  if not prefix and length is not None and not 0 <= int(length) <= limit:
                      raise ValueError("Response length")
                  body = response.read(limit if prefix else limit + 1)
                  if len(body) > limit:
                      raise ValueError("Response limit")
                  return response.status, response.getheader("Content-Type", "").split(";", 1)[0].strip().lower(), body
              finally:
                  connection.close()
                  signal.setitimer(signal.ITIMER_REAL, 0)


          class ReadyLater(Exception):
              pass


          class Operator:
              def __init__(self, env, wire=exchange, clock=time.monotonic, nap=time.sleep, emit=lambda _value: None):
                  self.account = env.get("CLOUDFLARE_ACCOUNT_ID", "")
                  self.token = env.get("VLPDS_DEPLOY_TOKEN", "")
                  self.cf_token = env.get("CLOUDFLARE_API_TOKEN", "")
                  if not re.fullmatch(r"[a-f0-9]{32}", self.account) or not re.fullmatch(r"[a-f0-9]{64}", self.token) or not re.fullmatch(r"[A-Za-z0-9_-]{20,256}", self.cf_token):
                      raise ValueError("Missing existing bindings")
                  self.expected = "registry.cloudflare.com/" + self.account + "/vlpds@sha256:" + DIGEST
                  self.api = "/client/v4/accounts/" + self.account + "/workers/scripts/crate-pds/"
                  self.wire, self.clock, self.nap, self.emit = wire, clock, nap, emit
                  self.until = clock() + 300
                  self.attempted, self.stage = False, "preconditions"

              def request(self, method, host, path, limit=4096, prefix=False):
                  headers = {"Accept": "application/json" if host != PUBLIC or path == "/xrpc/_health" else "*/*", "Accept-Encoding": "identity", "Cache-Control": "no-store"}
                  if host == CF and method == "GET" and path in [self.api + "deployments", self.api + "versions/" + WORKER]:
                      headers["Authorization"] = "Bearer " + self.cf_token
                  elif host == ADMIN and (method, path) in [("GET", "/_deploy/status"), ("POST", "/_deploy/restart")]:
                      headers["Authorization"] = "Bearer " + self.token
                      if method == "POST":
                          headers["X-Deploy-Image"] = self.expected
                  elif not (host == PUBLIC and method == "GET" and path in ["/xrpc/_health", "/account/spaces", ASSET, CARD]):
                      raise ValueError("Unsupported operation")
                  return self.wire(method, host, path, headers, limit, prefix, self.until - self.clock())

              def json_get(self, host, path, limit=4096):
                  status, kind, body = self.request("GET", host, path, limit)
                  if self.stage == "verification" and status in [502, 503, 504]:
                      raise ReadyLater("Readiness pending")
                  if status != 200 or kind != "application/json":
                      raise ValueError("JSON endpoint unavailable")
                  return decoded(body)

              def off_config(self):
                  deployments = self.json_get(CF, self.api + "deployments", 262144)
                  if deployments.get("success") is not True:
                      raise ValueError("Deployment metadata unavailable")
                  latest = deployments["result"]["deployments"][0]["versions"]
                  if len(latest) != 1 or latest[0].get("version_id") != WORKER or latest[0].get("percentage") != 100:
                      raise ValueError("Worker traffic/version changed")
                  version = self.json_get(CF, self.api + "versions/" + WORKER, 262144)
                  if version.get("success") is not True or version["result"].get("id") != WORKER:
                      raise ValueError("Worker metadata mismatch")
                  rows = version["result"]["resources"]["bindings"]
                  bindings = {row["name"]: row for row in rows}
                  if len(bindings) != len(rows):
                      raise ValueError("Duplicate binding")
                  if {name: row.get("type") for name, row in bindings.items()} != EXPECTED_BINDINGS:
                      raise ValueError("Worker binding scope changed")
                  for name, value in [("AGENT_A2A_ENABLED", "false"), ("AGENT_A2A_RUNTIME", "native-profile-v1"), ("PUBLIC_HOST", PUBLIC), ("ADMIN_HOST", ADMIN), ("ENABLED", "true")]:
                      if bindings.get(name, {}).get("type") != "plain_text" or bindings[name].get("text") != value:
                          raise ValueError("OFF scope mismatch")
                  if {name for name in bindings if name.startswith("AGENT_A2A_")} != {"AGENT_A2A_ENABLED", "AGENT_A2A_RUNTIME"}:
                      raise ValueError("Unexpected agent configuration/credentials")

              def status(self):
                  value = self.json_get(ADMIN, "/_deploy/status")
                  if type(value) is not dict or set(value) != {"desired", "current", "running"} or type(value["running"]) is not bool or value["desired"] != self.expected:
                      raise ValueError("Desired image drift")
                  pattern = r"registry\.cloudflare\.com/" + self.account + r"/(?:vlpds|crate-pds-pds-pds)@sha256:[a-f0-9]{64}"
                  if value["current"] is not None and (type(value["current"]) is not str or not re.fullmatch(pattern, value["current"])):
                      raise ValueError("Unexpected current image")
                  return value

              def public_checks(self):
                  status, kind, body = self.request("GET", PUBLIC, "/account/spaces", 131072)
                  if self.stage == "verification" and status in [502, 503, 504]:
                      raise ReadyLater("UI pending")
                  scripts = ScriptInventory()
                  scripts.feed(body.decode("utf-8"))
                  scripts.close()
                  if status != 200 or kind != "text/html" or scripts.sources != [ASSET]:
                      raise ValueError("UI mismatch")
                  status, kind, body = self.request("GET", PUBLIC, ASSET, 1, True)
                  if self.stage == "verification" and status in [502, 503, 504]:
                      raise ReadyLater("Asset pending")
                  if status != 200 or kind not in ["text/javascript", "application/javascript"] or not body:
                      raise ValueError("UI asset unavailable")
                  card_status = self.request("GET", PUBLIC, CARD, 1024)[0]
                  if self.stage == "verification" and card_status in [502, 503, 504]:
                      raise ReadyLater("Public route pending")
                  if card_status != 404:
                      raise ValueError("Agent Card is not disabled")
                  health = self.json_get(PUBLIC, "/xrpc/_health")
                  if type(health) is not dict or not isinstance(health.get("version"), str) or not health["version"]:
                      raise ValueError("Unhealthy baseline")

              def complete(self):
                  self.off_config()
                  initial = self.status()
                  if initial["running"] is not True:
                      raise ValueError("No healthy running baseline")
                  fresh_from = self.clock()
                  self.public_checks()
                  self.off_config()
                  before = self.status()
                  if self.clock() - fresh_from > 30 or before["running"] is not True:
                      raise ValueError("Stale or unhealthy preconditions")
                  if before["current"] == self.expected:
                      self.stage = "verification"
                      return self.verify_target("already-running", before["current"])
                  if self.attempted:
                      raise ValueError("A restart was already attempted")
                  self.stage = "restart"
                  self.attempted = True
                  self.emit({"event": "restart-attempt", "expectedDigest": DIGEST})
                  status, kind, body = self.request("POST", ADMIN, "/_deploy/restart")
                  ack = decoded(body) if kind == "application/json" else None
                  if status != 202 or type(ack) is not dict or ack.get("desired") != self.expected or ack.get("starting") is not True or ack.get("restarted") is not True:
                      raise ValueError("Restart not acknowledged; never retry")
                  self.stage = "verification"
                  return self.verify_target("verified", before["current"])

              def verify_target(self, outcome, prior):
                  for _ in range(24):
                      try:
                          after = self.status()
                          if after["current"] not in [None, prior, self.expected]:
                              raise ValueError("Unexpected image during verification")
                          if after["running"] and after["current"] == self.expected:
                              self.public_checks()
                              self.off_config()
                              final = self.status()
                              if final["running"] and final["current"] == self.expected:
                                  return self.result(final, outcome)
                              raise ValueError("Image changed during verification")
                      except (ReadyLater, OSError, http.client.HTTPException):
                          pass  # Read-only readiness polling, never a second POST.
                      remaining = self.until - self.clock()
                      if remaining <= 0:
                          break
                      self.nap(min(5, remaining))
                  raise TimeoutError("Target was not verified")

              def result(self, status, outcome):
                  safe = {key: (value.replace("registry.cloudflare.com/" + self.account + "/", "registry.cloudflare.com/<account>/", 1) if type(value) is str else value) for key, value in status.items()}
                  return {"result": outcome, "restartAttempted": self.attempted, "workerVersion": WORKER, "offConfigVerified": True, "healthUiAndCard404Verified": True, **safe}


          def main():
              operator = None
              signal.signal(signal.SIGALRM, deadline)
              try:
                  operator = Operator(os.environ, emit=lambda value: print(json.dumps(value), flush=True))
                  print(json.dumps(operator.complete()), flush=True)
                  return 0
              except Exception:
                  print(json.dumps({"result": "failed", "stage": operator.stage if operator else "configuration", "restartAttempted": bool(operator and operator.attempted)}), flush=True)
                  print("Guarded restart failed; no retry performed", file=sys.stderr)
                  return 1
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)


          if __name__ == "__main__":
              sys.exit(main())
          # END_GUARDED_RESTART
          PY
