name: Read Cloudflare PDS status

on:
  workflow_dispatch:

# No checkout, GitHub API, package install or third-party action is needed.
permissions: {}

jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: production
    steps:
      - name: Read and sanitize deployment status
        env:
          VLPDS_DEPLOY_TOKEN: ${{ secrets.VLPDS_DEPLOY_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          # BEGIN_STATUS_READER
          import http.client
          import json
          import os
          import re
          import signal
          import ssl
          import sys

          IMAGE = re.compile(r"registry\.cloudflare\.com/(?P<account>[a-f0-9]{32})/(?P<repo>vlpds|crate-pds-pds-pds)@sha256:(?P<digest>[a-f0-9]{64})")

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("Duplicate field")
                  value[key] = item
              return value

          def sanitize(value):
              if type(value) is not dict or set(value) != {"desired", "current", "running"} or type(value["running"]) is not bool:
                  raise ValueError("Invalid status schema")
              def image(item):
                  match = IMAGE.fullmatch(item) if type(item) is str else None
                  if match is None:
                      raise ValueError("Invalid image reference")
                  safe = "registry.cloudflare.com/<account>/" + match["repo"] + "@sha256:" + match["digest"]
                  return match["account"], safe
              account, desired = image(value["desired"])
              current = None
              if value["current"] is not None:
                  current_account, current = image(value["current"])
                  if current_account != account:
                      raise ValueError("Mismatched image accounts")
              return {"desired": desired, "current": current, "running": value["running"]}

          def read_status(token, connection_factory=http.client.HTTPSConnection):
              if type(token) is not str or re.fullmatch(r"[a-f0-9]{64}", token) is None:
                  raise ValueError("Missing token")
              connection = connection_factory("admin.crate.social", 443, timeout=10, context=ssl.create_default_context())
              try:
                  connection.request("GET", "/_deploy/status", headers={"Authorization": "Bearer " + token, "Accept": "application/json", "Accept-Encoding": "identity"})
                  response = connection.getresponse()
                  if response.status != 200 or response.getheader("Content-Type", "").split(";", 1)[0].strip().lower() != "application/json":
                      raise ValueError("Status unavailable")
                  if response.getheader("Content-Encoding", "identity").lower() != "identity":
                      raise ValueError("Encoded response")
                  length = response.getheader("Content-Length")
                  if length is not None and not 0 <= int(length) <= 4096:
                      raise ValueError("Response length")
                  body = response.read(4097)
                  if len(body) > 4096:
                      raise ValueError("Response limit")
                  return sanitize(json.loads(body.decode("utf-8"), object_pairs_hook=unique_object))
              finally:
                  connection.close()

          def deadline(_signum, _frame):
              raise TimeoutError("Status deadline")

          def main():
              signal.signal(signal.SIGALRM, deadline)
              signal.alarm(15)
              try:
                  result = read_status(os.environ.get("VLPDS_DEPLOY_TOKEN"))
                  print(json.dumps(result, separators=(",", ":"), ensure_ascii=True))
                  return 0
              except Exception:
                  print("Deployment status check failed", file=sys.stderr)
                  return 1
              finally:
                  signal.alarm(0)

          if __name__ == "__main__":
              sys.exit(main())
          # END_STATUS_READER
          PY
