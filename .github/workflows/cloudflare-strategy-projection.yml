name: Read-only Durable Object strategy projection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crate-pds-cloudflare-production
  cancel-in-progress: false
jobs:
  project:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.1'
      - name: Project only effective update strategy
        env:
          DEPLOY_CONFIG: ${{ secrets.VLPDS_CLOUDFLARE_CONFIG_JSON }}
        run: node deploy/cloudflare/scripts/pilot-strategy-projection.mjs
      - name: Publish sanitized strategy projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exp710-strategy-projection-${{ github.run_id }}
          path: ${{ runner.temp }}/exp710-strategy-projection.json
          if-no-files-found: error
          retention-days: 1
